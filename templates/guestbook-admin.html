<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{guest.adminTitle}} · {{site.name}}</title><link rel="icon" href="/assets/star.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css?v={{asset_version}}"><script src="/background.js?v={{asset_version}}" defer></script><script src="/guestbook-admin.js?v={{asset_version}}" defer></script></head>
<body>{{>header}}<main id="main" class="info-page paper-card guestbook-admin"><h1>{{guest.adminTitle}}</h1><p>{{guest.adminNote}}</p><form id="moderator-login" class="moderator-login"><label for="moderator-key">{{guest.adminKey}}</label><input id="moderator-key" name="key" type="password" required minlength="32" autocomplete="off"><button class="primary" type="submit">{{guest.adminLogin}}</button></form><p id="moderator-feedback" role="status" aria-live="polite"></p><section id="moderator-panel" hidden><label for="moderator-filter">{{guest.adminFilter}}</label><select id="moderator-filter"><option value="pending">{{guest.adminPending}}</option><option value="approved">{{guest.adminApprove}}</option><option value="rejected">{{guest.adminReject}}</option></select><div id="moderator-list" class="guestbook-list"></div></section></main>{{>footer}}<script id="site-copy" type="application/json">{{copy_json}}</script></body></html>
